[package]
name = "conceal"
version = "0.7.1"
edition = "2024"
description = "Command line trash bin"
documentation = "https://github.com/TD-Sky/conceal"
repository = "https://github.com/TD-Sky/conceal"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["trash", "remove", "recycle", "freedesktop"]
license = "MIT"
include = [
  "src/**/*",
  "Cargo.toml",
  "Cargo.lock",
  "LICENSE*",
  "README.md",
  "build.rs",
]

[dependencies]
usage-rs = { version = "7.1.1", features = ["completions"] }
dirs = "7.0"
owo-colors = "4.0"
thiserror = "2"
trash = "5.2"
jiff = "0.2"
parse_datetime = "0.17"

[build-dependencies]
cfg_aliases = "0.2"

[profile.release]
lto = true
