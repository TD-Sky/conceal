name: Draft

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

env:
  SCCACHE_GHA_ENABLED: true
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-unix:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            gcc: gcc-riscv64-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v7

      - name: Install gcc
        if: matrix.gcc != ''
        run: sudo apt update && sudo apt install -yq ${{ matrix.gcc }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup nushell
        uses: hustcer/setup-nu@main

      - name: Build
        run: nu ./scripts/devops.nu build --target ${{ matrix.target }}

      - name: Zip artifact
        uses: TheDoctor0/zip-release@0.7.6
        with:
          filename: conceal-${{ matrix.target }}.zip
          path: conceal-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            conceal-${{ matrix.target }}.zip

  build-windows:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link.exe
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER: lld-link.exe
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup nushell
        uses: hustcer/setup-nu@main

      - name: Build
        run: nu ./scripts/devops.nu build --target ${{ matrix.target }}

      - name: Zip artifact
        uses: TheDoctor0/zip-release@0.7.6
        with:
          filename: conceal-${{ matrix.target }}.zip
          path: conceal-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: conceal-${{ matrix.target }}.zip

  build-musl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
    container:
      image: docker://ghcr.io/cross-rs/${{ matrix.target }}:edge
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup nushell
        uses: hustcer/setup-nu@main

      - name: Build
        run: nu ./scripts/devops.nu build --target ${{ matrix.target }}

      - name: Zip artifact
        uses: TheDoctor0/zip-release@0.7.6
        with:
          filename: conceal-${{ matrix.target }}.zip
          path: conceal-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            conceal-${{ matrix.target }}.zip

  draft:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [build-unix, build-windows, build-musl]
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Draft
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            conceal-*.zip
          generate_release_notes: true
